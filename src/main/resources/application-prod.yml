server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:testdatagen}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:testdatagen}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  h2:
    console:
      enabled: false

app:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
    model: ${OPENAI_MODEL:deepseek-v4-flash}
    max-tokens: 10000
    temperature: 0.8
    timeout-seconds: 60
    models:
      "[mimo-v2.5-pro]":
        base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com/}
        api-key: ${MIMO_API_KEY:}
        name: Mimo V2.5 Pro
      "[deepseek-v4-flash]":
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        api-key: ${DEEPSEEK_API_KEY:}
        name: DeepSeek V4 Flash
  knowledge-base:
    enabled: ${KB_ENABLED:false}
    base-url: ${KB_BASE_URL:http://localhost:9090}
    api-key: ${KB_API_KEY:}
    timeout-seconds: ${KB_TIMEOUT:30}
  encryption:
    secret-key: ${ENCRYPTION_KEY:}
  generation:
    default-batch-size: 100
    max-batch-size: 10000
    insert-batch-size: 500
    llm-batch-size: 50
